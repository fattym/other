<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - DeHeus</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #1a1a1a;
      --card: #242424;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --accent: #2e7d32;
      --accent-soft: #1b5e20;
      --border: #333333;
      --error: #dc2626;
      --error-soft: #450a0a;
      --success: #16a34a;
      --success-soft: #052e16;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .icon {
      width: 56px;
      height: 56px;
      background: var(--accent-soft);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 28px;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 2rem;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #1a1a1a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 0.9rem;
      margin-top: 0.5rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover:not(:disabled) {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      display: none;
    }

    .message.error {
      display: block;
      background: var(--error-soft);
      color: #fca5a5;
      border: 1px solid var(--error);
    }

    .message.success {
      display: block;
      background: var(--success-soft);
      color: #86efac;
      border: 1px solid var(--success);
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .back-link:hover {
      color: var(--text);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon">🔒</div>
      <h1 id="title">Set New Password</h1>
      <p class="subtitle" id="subtitle">Enter your new password below.</p>

      <form id="resetForm" class="hidden">
        <div class="field">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat your new password" required minlength="6" />
        </div>
        <button type="submit" id="submitBtn">Update Password</button>
      </form>

      <div id="loadingMessage" style="text-align:center; padding: 1rem 0;">
        <span class="spinner"></span> Verifying reset link...
      </div>

      <div id="message" class="message"></div>

      <a href="https://other-ashen.vercel.app" class="back-link">Back to Sign In</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nlikgeqoocimbbqyaegq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7GsRwLNjTPaUpulq5GrLfg_4HbEkq3Z';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('message');
    const loadingEl = document.getElementById('loadingMessage');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.innerHTML = isLoading
        ? '<span class="spinner"></span> Updating...'
        : 'Update Password';
    }

    async function initSession() {
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const code = params.get('code') || hashParams.get('code');
      const accessToken = params.get('access_token') || hashParams.get('access_token');
      const refreshToken = params.get('refresh_token') || hashParams.get('refresh_token');

      try {
        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
        } else if (accessToken && refreshToken) {
          const { error } = await supabase.auth.setSession(accessToken, refreshToken);
          if (error) throw error;
        } else {
          throw new Error('Invalid or expired reset link.');
        }

        loadingEl.classList.add('hidden');
        form.classList.remove('hidden');
      } catch (err) {
        loadingEl.classList.add('hidden');
        titleEl.textContent = 'Link Invalid';
        subtitleEl.textContent = 'This password reset link is invalid or has expired.';
        showMessage(err.message || 'Please request a new reset link.', 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (password.length < 6) {
        showMessage('Password must be at least 6 characters.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      setLoading(true);
      showMessage('', '');

      try {
        const { error } = await supabase.auth.updateUser({ password: password });
        if (error) throw error;

        showMessage('Password updated successfully. Redirecting to sign in...', 'success');
        form.classList.add('hidden');
        setTimeout(() => {
          window.location.href = 'https://other-ashen.vercel.app';
        }, 2000);
      } catch (err) {
        showMessage(err.message || 'Failed to update password. Please try again.', 'error');
      } finally {
        setLoading(false);
      }
    });

    initSession();
  </script>
</body>
</html>
